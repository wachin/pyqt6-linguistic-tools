name: Fast CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typing:
    name: Static typing / Python 3.10 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out toolkit
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check out portable engine submodules
        run: git submodule update --init --depth 1 libs/spylls libs/pythes

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt and typing dependencies
        run: python -m pip install --upgrade pip ".[qt,typing]"

      - name: Check the complete public implementation
        run: python -m mypy

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out toolkit
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check out portable engine submodules
        run: git submodule update --init --depth 1 libs/spylls libs/pythes

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test and Qt dependencies
        run: python -m pip install --upgrade pip ".[test,qt]"

      - name: Run deterministic fast suite
        run: python -m pytest -m "not corpus and not platform"

  ubuntu-system-dictionaries:
    name: Ubuntu system dictionaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out toolkit
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check out portable engine submodules
        run: git submodule update --init --depth 1 libs/spylls libs/pythes

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Spanish system dictionaries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends hunspell-es mythes-es

      - name: Install test and Qt dependencies
        run: python -m pip install --upgrade pip ".[test,qt]"

      - name: Run deterministic fast suite
        run: python -m pytest -m "not corpus and not platform"

      - name: Run Linux platform smoke tests
        run: python -m pytest -m platform
