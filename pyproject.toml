[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqt6-linguistic-tools"
version = "0.1.0.dev0"
description = "Reusable cross-platform linguistic tools for Python and PyQt6"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GuitarChordStudio contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest>=8"]
qt = ["PyQt6>=6.6"]

[tool.setuptools.packages.find]
where = ["src", "libs/spylls", "libs/pythes"]
include = ["pyqt6_linguistic_tools*", "spylls*", "pythes*"]
exclude = ["tests*"]

[tool.setuptools]
license-files = ["libs/spylls/LICENSE", "libs/pythes/LICENSE"]

[tool.setuptools.package-data]
"spylls.hunspell" = ["data/**/*.aff", "data/**/*.dic", "data/**/README*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "libs/spylls", "libs/pythes"]
markers = [
  "corpus: requires an external LibreOffice dictionaries collection",
  "full_corpus: scans every compatible file in the external corpus",
]
